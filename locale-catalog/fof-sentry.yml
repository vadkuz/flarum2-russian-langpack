    sections:
      general: 'Общие настройки'
      general_help: 'Настройте DSN Sentry и параметры окружения.'
      user_context: 'Контекст пользователя'
      user_context_help: 'Управляйте тем, какая информация о пользователях отправляется в Sentry в отчетах об ошибках.'
      backend_performance: 'Мониторинг производительности (Backend)'
      backend_performance_help: 'Отслеживайте производительность PHP (tracing и profiling). Настройте частоты выборки, чтобы контролировать накладные расходы.'
      database_monitoring: 'Мониторинг запросов к базе данных'
      database_monitoring_help: 'Следите за производительностью запросов, выявляйте медленные запросы и проблемы N+1. Активно только при включенном мониторинге производительности Backend.'
      frontend_monitoring: 'Мониторинг фронтенда (JavaScript)'
      frontend_monitoring_help: 'Отслеживайте ошибки JavaScript и производительность фронтенда. Учтите, что включение некоторых функций увеличивает размер бандла.'

    settings:
      dsn_label: 'Sentry DSN'
      dsn_help: 'Ваш Sentry Data Source Name: основной URL подключения для отчетов об ошибках (frontend и backend). Возьмите его в настройках проекта Sentry. Важно: если используете Relay DSN, отключите "Обратную связь", так как для нее требуется прямой доступ к Sentry.'
      dsn_backend_label: 'Sentry DSN (только Backend)'
      dsn_backend_help: 'Необязательный отдельный DSN исключительно для ошибок Backend (PHP). Полезно, если Вы используете другой проект Sentry для backend, проксируете через Relay для производительности, или разделяете отслеживание frontend и backend. Если не задано, основной DSN выше будет использоваться для обоих.'
      environment_label: 'Окружение Sentry'
      environment_help: 'Помечать все события названием окружения (например, "production", "staging", "development"). Это помогает фильтровать ошибки по окружению и настраивать разные правила оповещений.'

      user_feedback_label: 'Обратная связь'
      user_feedback_help: 'Если включено, пользователи видят форму обратной связи после возникновения ошибки и могут описать, что произошло. Форма будет предзаполнена именем пользователя, email (если разрешено) и группой. Требуется прямой Sentry DSN (не Relay DSN).'
      send_user_emails_label: 'Отправлять адреса e-mail пользователей с отчётами Sentry?'
      send_user_emails_help: 'Если включено, email-адреса пользователей будут включаться во все события Sentry. Внимание к приватности: проверьте политику конфиденциальности перед включением. ID пользователя, имя и группы отправляются всегда, независимо от этой настройки.'

      monitor_performance_label: 'Частота мониторинга производительности (BACK-END) (0 - 100)'
      monitor_performance_help: 'Процент backend-запросов для трассировки (0 = отключено, 100 = все). Трассировки включают время запроса/ответа, запросы к БД и загрузку расширений. Рекомендация: 10-25% в production, 100% в staging. Меньшие значения уменьшают объем данных и стоимость Sentry.'
      profile_rate_label: 'Частота профилирования (BACK-END) (0 - 100)'
      profile_rate_help: 'Процент трассируемых транзакций, которые будут профилироваться (относительно частоты мониторинга выше). Пример: мониторинг = 10% и профилирование = 50% означает, что 5% всех запросов будут профилироваться. Профилирование добавляет накладные расходы. См. <a>руководство по оптимизации Sentry</a>. {icon} <bold>Требуется расширение Excimer (только Linux). Сейчас: {icon}.</bold>'

      javascript_label: 'Оповещение об ошибках JavaScript'
      javascript_help: 'Собирать и отправлять в Sentry ошибки JavaScript с фронтенда форума. Отслеживает необработанные исключения, ошибки промисов, сообщения консоли и сетевые сбои. Отключите, если хотите отслеживать только backend.'
      javascript_console_label: 'Захват консоли JavaScript'
      javascript_console_help: 'Записывать console.log/info/warn/error как breadcrumbs. Помогает увидеть последовательность событий перед ошибкой. Внимание: увеличивает объем данных.'
      javascript_trace_sample_rate: 'Частота мониторинга производительности (FRONT-END) (0 - 100)'
      javascript_trace_sample_rate_help: 'Процент загрузок страниц для трассировки (0 = отключено, 100 = все). Отслеживает время загрузки, ресурсы, API-запросы и навигацию. Размер бандла: +~30 KB. Рекомендация: 10-25% в production.'
      javascript_replays_session_sample_rate: 'Частота записи сеансов (Session Replay)'
      javascript_replays_session_sample_rate_help: 'Процент пользовательских сессий для записи с самого начала. Записывает движения мыши, клики, прокрутку, навигацию и действия в формах (с маскированием PII). Размер бандла: +~150 KB. Рекомендация: 1-5% в production из-за стоимости хранения.'
      javascript_replays_error_sample_rate: 'Частота записи при ошибке (Error Replay)'
      javascript_replays_error_sample_rate_help: 'Процент сессий для записи только при возникновении ошибки. Записывает до 1 минуты до ошибки и продолжает до конца сессии. Размер бандла: +~150 KB. Рекомендация: 10-25% в production.'

      db_slow_query_threshold_label: 'Порог медленного запроса (миллисекунды)'
      db_slow_query_threshold_help: 'Запросы, выполняющиеся дольше этого порога (в миллисекундах), будут считаться медленными и отслеживаться независимо от частоты выборки. Значения по умолчанию: 1000 мс. Для более агрессивного обнаружения можно снизить до 500 мс.'
      db_n_plus_one_detection_label: 'Включить обнаружение N+1 запросов'
      db_n_plus_one_detection_help: 'Автоматически выявлять проблемы N+1, отслеживая повторяющиеся шаблоны запросов. Помогает находить серьезные узкие места производительности.'
      db_n_plus_one_threshold_label: 'Порог обнаружения N+1'
      db_n_plus_one_threshold_help: 'Сколько раз должен повториться шаблон запроса, чтобы он был помечен как потенциальная проблема N+1. Рекомендация: 10-20 (сбалансировано). По умолчанию: 10.'
      db_track_bindings_label: 'Отслеживать значения параметров запроса'
      db_track_bindings_help: 'Включать фактические значения параметров в запросах (например, "WHERE id = 123" вместо "WHERE id = ?"). Внимание к безопасности и приватности: это может раскрывать чувствительные данные в Sentry. Рекомендация: включать в staging/development и отключать в production.'
      db_query_sample_rate_label: 'Доля отслеживаемых запросов к базе данных'
      db_query_sample_rate_help: 'Процент запросов к БД для отслеживания в мониторинге производительности (0-100%). Примечание: медленные запросы (выше порога) отслеживаются всегда. Рекомендация: 10-25% на высоконагруженных сайтах.'
