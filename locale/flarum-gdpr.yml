flarum-gdpr:
  admin:
    gdpr_page:
      heading: 'Просмотр данных ОРЗД (GDPR)'
      description: 'Статус различных действий и интеграций ОРЗД (GDPR)'
      data_types:
        title: 'Типы данных'
        help_text: "Найдены зарегистрированные типы данных. Они перечислены с указанием ассоциированных с ними действиями
          экспорта, анонимизации и удаления. Если расширение использует любые данные, подпадающие под ОРЗД (GGPR), оно должно
          их зарегистрировать через <code>flarum/gdpr</code>.\nДанные, хранящиеся в таблице <code>user</code> , обрабатываются
          отдельно, см. данные пользовательской таблицы ниже.\n"
        type: Тип
        export_description: 'Экспорт действия'
        anonymize_description: 'Анонимизировать действие'
        delete_description: 'Удалить действие'
        extension: Расширение
      settings:
        heading: 'Настройки ОРЗД (GDPR)'
        help_text: 'Ищете настройки ОРЗД (GDPR)? Они находятся на странице расширений.'
        extension_settings_button: 'Настройки ОРЗД (GDPR)'
      user_table_data:
        not_yet_implemented: Пока не реализовано
        title: 'Табличные данные пользователя'
        help_text: "По большей части все столбцы, добавленные в таблицу <code>пользователь</code> , обрабатываются автоматически
          - для экспорта данных и для удаления.\nТем не менее, есть несколько особых случаев, перечисленных далее.\n"
    nav:
      gdpr_button: 'Интеграции ОРЗД (GDPR)'
      gdpr_title: => flarum-gdpr.admin.gdpr_page.description
    permissions:
      process_erasure: 'Обработать запросы на удаление'
      process_export_for_others: Запрашивать и получать экспорт данных других пользователей
      see_anonymized_user_badges: 'Посмотреть анонимизированные жетоны пользователей'
    settings:
      allow_anonymization: 'Разрешить анонимизацию запросов на удаление'
      allow_anonymization_help: Опция по умолчанию и рекомендуемая для большинства сообществ. В этом режиме 
        сообщения/комментарии по возможности сохраняются в рамках GDPR, но любая идентифицирующая пользователя 
        информация удаляется.
      allow_deletion: 'Разрешить удаление по запросу'
      allow_deletion_help: 'Более жесткая опция. В этом режиме все сообщения/комментарии будут удалены и пользователь будет
        удален из базы. Пользуйтесь осторожно.'
      default_anonymous_username: 'Имя пользователя по умолчанию для анонимизированных пользователей'
      default_anonymous_username_help: Когда пользователь анонимизируется, его имя будет заменено на это значение плюс 
        ID запроса на анонимизацию, например <code>Anonymous123</code>.
      default_erasure: Действие по умолчанию для запросов на удаление
      default_erasure_help: Какое действие должно выполняться по умолчанию для запросов на удаление?
      default_erasure_options:
        anonymization: Анонимизация
        deletion: Удаление
      gdpr_page:
        title: Интеграция данных и действия
        help_text: Прежде чем выбирать действия для форума, важно понять, какие данные интегрированы и как они 
          обрабатываются как при анонимизации, так и при удалении. Перейдите к обзору GDPR, чтобы понять обработку 
          данных и какие дополнительные расширения зарегистрировали свои данные для работы через это расширение.
    userlist:
      columns:
        user_actions:
          data_export:
            button: Экспорт
            tooltip: Экспортировать данные пользователя {username}
  lib:
    data:
      avatar:
        delete_description: Удаляет аватар пользователя из файловой системы.
        export_description: Получает аватар пользователя из файловой системы и включает его в экспорт.
      discussions:
        export_description: Экспортирует все темы, начатые пользователем. Данные ограничены заголовком и датой 
          создания.
      forum:
        export_description: Экспортирует название форума, URL, имя пользователя, email и текущую дату.
      no_action: Действие не выполняется.
      posts:
        anonymize_description: Удаляет IP-адрес из всех сообщений, оставленных пользователем.
        delete_description: Удаляет все сообщения, оставленные пользователем.
        export_description: Экспортирует все сообщения, оставленные пользователем. Данные ограничены содержимым, датой 
          создания, IP-адресом и ID темы.
      tokens:
        delete_description: Удаляет все токены, созданные пользователем.
        export_description: Экспортирует все токены, созданные пользователем. Данные ограничены датой создания и типом 
          токена.
      user:
        anonymize_description: Устанавливает все столбцы в таблице пользователя в null. Столбцы, не допускающие null, 
          получают значения по умолчанию или специальные значения. Пароль изменяется, настройки сбрасываются, все группы
          удаляются.
        delete_description: Удаляет пользователя из базы данных.
        export_description: Экспортирует данные из таблицы пользователя. Все столбцы, кроме id и пароля.
    request_data:
      title: Запрос данных для пользователя {username}
      text: >
        Для Вас будет подготовлен ZIP-архив. Когда он будет готов, Вы получите уведомление со ссылкой на скачивание. Ссылка
        будет активна в течение одного дня.
      request_button: Запросить архив
  email:
    confirm_erasure:
      subject: Подтвердите запрос на удаление аккаунта
      body: |
        Кто-то (надеемся, что Вы) только что запросил удаление аккаунта `{display_name}`.

        Чтобы подтвердить это действие, перейдите по ссылке ниже. После этого запрос будет обработан нашей командой.

        {erasure_confirm_url}
    erasure_completed:
      deletion:
        subject: Удаление аккаунта завершено
        body: |
          Это автоматическое финальное уведомление о том, что Ваш аккаунт удалён.
      anonymization:
        subject: Анонимизация аккаунта завершена
        body: |
          Это автоматическое финальное уведомление о том, что Ваш аккаунт анонимизирован.
    erasure_cancelled:
      subject: Запрос на удаление аккаунта отменён
      body: |
        Это автоматическое уведомление о том, что Ваш запрос на отмену удаления аккаунта обработан.

        Ваш аккаунт больше не будет удалён.
    export_available:
      subject: Экспорт данных готов
      body: |
        Вы запросили экспорт данных аккаунта пользователя {username}. Экспорт успешно сформирован и доступен по ссылке:

        {url}

        Этот экспорт будет доступен до {destroys_at}.
  forum:
    badges:
      anonymized_user: Анонимизированный пользователь
    delete_user:
      title: Удалить аккаунт пользователя {username}
      text: |
        Вы уверены, что хотите удалить аккаунт пользователя {username}?

        Это действие необратимо.
      modal_delete_button: Удалить с действием по умолчанию
      delete_button: Удалить
    erasure_requests:
      empty_text: Нет ожидающих запросов на удаление аккаунта
      item_text: "{name} запросил(а) удаление аккаунта"
      tooltip: Запросы на удаление аккаунта
      title: Запросы на удаление аккаунта
    erasure_request_confirmed: Вы подтвердили запрос на удаление аккаунта. Действие будет выполнено в течение 30 дней, 
      как требует GDPR.
    settings:
      data:
        heading: Персональные данные
      export_data_button: Экспорт данных
      export_data_help: "Запрос экспорта данных предоставит Вам загружаемую копию всей информации, связанной с Вашим аккаунтом.
        Сюда входят сообщения, комментарии и данные профиля."
      request_erasure_button: Удалить аккаунт
      request_erasure_help: "Запрос на удаление безвозвратно удалит аккаунт и все связанные данные. Это действие необратимо.
        Перед продолжением убедитесь, что сохранили нужный Вам контент."
    process_erasure:
      confirm: Вы уверены, что хотите удалить аккаунт пользователя {name} в режиме {mode}?
      title: Обработка запроса на удаление
      text: "{name} запросил(а) удаление аккаунта."
      comments_label: Комментарии (необязательно)
      anonymization_button: Анонимизировать пользователя
      deletion_button: Удалить пользователя
    request_erasure:
      title: Запрос на удаление аккаунта
      reason: "Вы указали следующую причину: {reason}"
      status:
        awaiting_user_confirmation: |
          Вам должно прийти письмо для подтверждения запроса на удаление аккаунта.
        user_confirmed: |
          Вы подтвердили запрос на удаление аккаунта. Действие будет выполнено в течение 30 дней, как требует GDPR.
      text: После получения и подтверждения запроса администратор рассмотрит его в течение 30 дней, как требует GDPR.
      password_label: Подтвердите пароль
      reason_label: Причина (необязательно)
      cancel_button: Отменить запрос
      request_button: Запросить удаление
    notification:
      export-ready: "Экспорт данных для пользователя {username} готов к загрузке."
    export_file: Экспорт пользовательских данных для {username} ({email}), подготовлен {date} с форума {forumTitle} 
      ({url})
