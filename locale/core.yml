          begin_button_text: Начать разделение пополам
          continue_button_text: Продолжить пополам
          label: Расширение пополам
          help: Помогает определить расширение, вызывающее наблюдаемую вами проблему. Это автоматически переводит форум 
            в режим обслуживания (низкий), пока процесс не завершится.
        bisect_modal:
          description: >-
            Это переводит форум в режим обслуживания (низкий), пока процесс не завершится. На каждом этапе некоторые расширения
            будут отключены, пока мы не найдем то, которое вызывает проблему. Поэтому не удивляйтесь, увидев отсутствующие
            функции или другой дизайн темы. Держите эту страницу открытой и пытайтесь воспроизводить проблему после каждого
            шага на отдельной странице. Вы всегда можете вернуться на эту страницу, если по ошибке закроете ее.
          end_button: Закройте и перейдите на страницу расширения.
          issue_question: Проблема все еще возникает?
          issue_question_help: Попробуйте воспроизвести проблему на отдельной странице и ответьте на основе результата.
          no_button: Нет
          result_description: >-
            Форум больше не находится в режиме обслуживания. Расширение биссектрисы закончено. Судя по вашим ответам на каждый
            шаг, причиной проблемы является следующее расширение:
          start_button: Начать деление пополам
          stop_button: Остановить пополам
          steps_left: "Осталось шагов: {steps}"
          total_steps: Это займет около {steps} шагов.
          title: Расширение пополам
          yes_button: Да
